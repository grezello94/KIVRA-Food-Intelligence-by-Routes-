services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  kivra:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      Database__Provider: ${DATABASE_PROVIDER:?Set DATABASE_PROVIDER in .env}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Bootstrap__AdminPin: ${BOOTSTRAP_ADMIN_PIN:?Set BOOTSTRAP_ADMIN_PIN in .env}
volumes:
  postgres-data:
